[project]
name = "comp-766-a1"
version = "0.1.0"
description = "Curve inference with oriented convolution and relaxation labeling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "test", "report/generate_assets.py"]
extraPaths = ["src"]
